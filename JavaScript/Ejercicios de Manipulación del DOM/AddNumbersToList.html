<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ejercicio 1 - Lista dinámica</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container">
    <section class="exercise">
      <h1>Ejercicio 1: Lista dinámica</h1>

      <p>
        Agrega elementos a una lista ordenada o elimina todos
        los elementos existentes.
      </p>

      <div class="button-group">
        <button id="add-item-button" type="button">
          Agregar elemento
        </button>

        <button
          id="clear-list-button"
          type="button"
          class="danger-button"
        >
          Limpiar lista
        </button>
      </div>

      <ol id="dynamic-list" class="dynamic-list"></ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
