<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ejercicio 3 - Formulario</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container">
    <section class="exercise">
      <h1>Ejercicio 3: Formulario de registro</h1>

      <form id="registration-form">
        <div class="form-group">
          <label for="email">Correo:</label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="correo@ejemplo.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Ingrese una contraseña"
            required
          >
        </div>

        <div class="form-group">
          <label for="first-name">Nombre:</label>

          <input
            id="first-name"
            name="firstName"
            type="text"
            placeholder="Ingrese su nombre"
            required
          >
        </div>

        <div class="form-group">
          <label for="last-name">Apellidos:</label>

          <input
            id="last-name"
            name="lastName"
            type="text"
            placeholder="Ingrese sus apellidos"
            required
          >
        </div>

        <fieldset class="employment-section">
          <legend>¿Actualmente tiene empleo?</legend>

          <label class="radio-option">
            <input
              id="employment-yes"
              name="hasEmployment"
              type="radio"
              value="yes"
              required
            >
            Sí
          </label>

          <label class="radio-option">
            <input
              id="employment-no"
              name="hasEmployment"
              type="radio"
              value="no"
              required
            >
            No
          </label>
        </fieldset>

        <div id="employment-field" class="form-group hidden">
          <label for="employment-name">
            Nombre del empleo:
          </label>

          <input
            id="employment-name"
            name="employmentName"
            type="text"
            placeholder="Ingrese el nombre de su empleo"
          >
        </div>

        <button type="submit">
          Registrar
        </button>
      </form>

      <div id="form-result" class="form-result hidden"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
