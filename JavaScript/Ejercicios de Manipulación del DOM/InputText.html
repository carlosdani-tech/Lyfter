<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ejercicio 2 - Captura de texto</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container">
    <section class="exercise">
      <h1>Ejercicio 2: Captura de texto</h1>

      <p>
        Escribe un dato y presiona el botón para mostrarlo
        en pantalla.
      </p>

      <div class="form-group">
        <label for="text-input">Ingrese un texto:</label>

        <input
          id="text-input"
          type="text"
          placeholder="Escriba algo..."
        >
      </div>

      <button id="show-text-button" type="button">
        Mostrar texto
      </button>

      <div id="text-results" class="results-container"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
