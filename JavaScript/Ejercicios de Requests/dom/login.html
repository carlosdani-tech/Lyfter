<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login</title>

  <link rel="stylesheet" href="./css/styles.css">

  <script
    src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"
    defer
  ></script>

  <script src="./js/api.js" defer></script>
  <script src="./js/login.js" defer></script>
</head>

<body>

  <main class="container">

    <h1>Iniciar sesión</h1>

    <form id="login-form">

      <label for="user-id">
        ID del usuario
      </label>

      <input
        id="user-id"
        type="text"
        required
      >

      <label for="password">
        Contraseña
      </label>

      <input
        id="password"
        type="password"
        required
      >

      <button type="submit">
        Iniciar sesión
      </button>

    </form>

    <p id="message"></p>

    <a href="./register.html">
      Crear cuenta
    </a>

  </main>

</body>
</html>
