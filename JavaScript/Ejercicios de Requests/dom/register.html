<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Registro</title>

  <link rel="stylesheet" href="./css/styles.css">

  <script
    src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"
    defer
  ></script>

  <script src="./js/api.js" defer></script>
  <script src="./js/register.js" defer></script>
</head>

<body>
  <main class="container">

    <h1>Registro</h1>

    <form id="register-form">

      <label for="name">
        Nombre
      </label>

      <input
        id="name"
        type="text"
        required
      >

      <label for="email">
        Correo
      </label>

      <input
        id="email"
        type="email"
        required
      >

      <label for="password">
        Contraseña
      </label>

      <input
        id="password"
        type="password"
        required
      >

      <button type="submit">
        Crear usuario
      </button>

    </form>

    <p id="message"></p>

    <p>
      ¿Ya tiene una cuenta?
      <a href="./login.html">
        Iniciar sesión
      </a>
    </p>

  </main>
</body>
</html>
