<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lyfter Pet Store | Administración</title>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body>
    <header class="site-header" data-navbar></header>
    <main class="page-shell">
      <div
        class="state-message"
        data-admin-status
        role="status"
        aria-live="polite"
      ></div>

      <div data-admin-root hidden>
        <section class="page-heading admin-heading-row">
          <div>
            <p class="eyebrow">Administración</p>
            <h1>Panel administrativo</h1>
            <p>Gestiona productos, inventario y ventas registradas.</p>
          </div>
          <a class="button primary-button" href="./edit-product.html"
            >Crear producto</a
          >
        </section>

        <section class="panel admin-table-panel">
          <div class="table-header-row">
            <h2>Inventario</h2>
            <button
              class="button secondary-button"
              type="button"
              data-refresh-products
            >
              Actualizar
            </button>
          </div>
          <div class="responsive-table" data-products-table></div>
        </section>

        <section class="panel admin-table-panel">
          <div class="table-header-row">
            <h2>Ventas</h2>
            <button
              class="button secondary-button"
              type="button"
              data-refresh-sales
            >
              Actualizar ventas
            </button>
          </div>
          <div
            class="state-message"
            data-sales-status
            role="status"
            aria-live="polite"
          ></div>
          <div class="responsive-table" data-sales-table></div>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-content">
        <p>© Lyfter Pet Store 2026 — Todos los derechos reservados.</p>
        <nav class="footer-links" aria-label="Secundaria">
          <a href="./index.html">Inicio</a>
          <a href="./index.html">Instagram</a>
          <a href="./index.html">Facebook</a>
        </nav>
      </div>
    </footer>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/pages/adminPage.js"></script>
  </body>
</html>
